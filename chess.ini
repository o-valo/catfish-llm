[chess]

# ---- LLM (beliebiges OpenAI-kompatibles Chat-API) ----------------------------
# llm-bahnhof Proxy (Empfehlung):
LLM_BASE_URL=http://10.7.0.124:8000
LLM_MODEL=llm-bahnhof
LLM_API_KEY=

# Alternative: Ollama direkt (einfach umkommentieren)
# LLM_BASE_URL=http://localhost:11434
# LLM_MODEL=qwen3:8b
# LLM_API_KEY=ollama

# LM Studio:
# LLM_BASE_URL=http://localhost:1234/v1
# LLM_MODEL=local-model

LLM_TEMPERATURE=0.7
LLM_TIMEOUT=120
LLM_MAX_TOKENS=300

# ---- Stockfish ---------------------------------------------------------------
# Pfad relativ zum chess-Ordner (oder absolut)
ENGINE_PATH=engines/stockfish/stockfish-linux-x86-64-universal
# Alternativen (siehe README, Abschnitt "Schach-Engine: Auswahl & Austausch"):
#   Raspberry Pi / ARM – selbst gebaut:
#     ENGINE_PATH=engines/stockfish/src/stockfish
#   Distributions-Paket (sudo apt install stockfish):
#     ENGINE_PATH=/usr/games/stockfish
ENGINE_THREADS=2
ENGINE_HASH_MB=64
# Skill 0-20 (niedriger = schwächer/fehlertoleranter)
ENGINE_SKILL=12
# Denkzeit pro Zug in Millisekunden
ENGINE_MOVETIME_MS=1200
# Anzahl Kandidatenzüge, die dem LLM angeboten werden (1-5)
ENGINE_TOP_N=3

# ---- Persönlichkeit des LLM-Gegners ------------------------------------------
LLM_NAME=Gambit
LLM_STIL=herzlich, humorvoll, ein wenig theatralisch

# ==============================================================================
# Sektion [proxy] – chess_proxy.py (OpenAI-kompatibler Proxy mit Schach-Tools)
# ==============================================================================
[proxy]

# Adresse, auf der der Proxy lauscht:
#   0.0.0.0    = alle Netzwerk-Schnittstellen (Clients im Netz/VPN möglich)
#   127.0.0.1  = nur dieser Rechner (kein Zugriff von außen – z. B. wenn der
#                Zugriff ausschließlich über einen eigenen Reverse-Proxy geht)
#   <eigene IP> = nur diese Schnittstelle, z. B. 10.7.0.116 → nur über VPN
#                 erreichbar, nicht über das lokale Netz
# Welche Adressen der Host hat, zeigt: ./start_proxy.sh adressen
# Hinweis: 0.0.0.0 ohne gesetzten PROXY_API_KEY heißt, dass jeder im
#          erreichbaren Netz den Proxy (und damit das LLM-Kontingent)
#          mitbenutzen kann. Für ein offenes Netz besser 127.0.0.1 oder
#          eine konkrete VPN-Adresse wählen und/oder PROXY_API_KEY setzen.
PROXY_HOST=0.0.0.0
PROXY_PORT=8300

# Optional: API-Key, den Clients (OpenWebUI) als Bearer-Token senden müssen.
# Leer = keine Authentifizierung.
PROXY_API_KEY=

# Name, den der Proxy Clients gegenüber als Modell meldet
PROXY_MODEL_NAME=catfish-llm

# Sicherheitsgrenzen
MAX_TOOL_LOOPS=6
PROXY_MAX_TOKENS=500
